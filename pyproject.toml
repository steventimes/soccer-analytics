# Standard PEP 735 groups for this source-run application (pip >=25.1).
[dependency-groups]
runtime = [
    "requests==2.32.5",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "xgboost-cpu==3.4.1",
]
research = [
    {include-group = "runtime"},
    "scikit-learn==1.9.1",
    "scikit-optimize==0.10.2",
    "optuna==5.0.0",
    "fpstreams==2.4.1",
    "kloppy==3.19.1",
    "orjson==3.13.0",
    "matplotlib==3.11.2",
    "CairoSVG==2.9.1",
    "lightgbm==4.7.0",
    "catboost==1.2.10",
    "interpret-core==0.7.8",
]
checks = ["ruff==0.17.1"]
# Add after research, using the official CPU wheel index only for this group.
deep-learning = ["torch==2.8.0"]
# Separate environments: these groups do not inherit runtime or its constraints.
sources = ["soccerdata==1.9.1"]
vaep = [
    "socceraction==1.5.3",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "pandera==0.17.2",
    "multimethod==1.12",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F821", "F822", "F823"]
