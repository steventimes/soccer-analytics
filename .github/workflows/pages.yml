name: Deploy docs to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Project checks", "Daily model refresh"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       ((github.event.workflow_run.name == 'Project checks' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_sha == github.workflow_sha) ||
        (github.event.workflow_run.name == 'Daily model refresh' &&
         (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      validated: ${{ steps.source.outputs.validated }}
    steps:
      # Checks completion reuses that push's exact validation revision. Daily
      # refresh and manual releases validate the caller's pinned revision below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.name == 'Project checks' && github.event.workflow_run.head_sha || github.workflow_sha }}
      - id: source
        name: Record the release commit
        env:
          VALIDATED: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Project checks' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "validated=$VALIDATED" >> "$GITHUB_OUTPUT"

  validate:
    if: needs.resolve.outputs.validated != 'true'
    needs: resolve
    uses: ./.github/workflows/checks.yml
    with:
      source_ref: ${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read

  build:
    if: >-
      always() && needs.resolve.result == 'success' &&
      ((needs.resolve.outputs.validated == 'true' && needs.validate.result == 'skipped') ||
       needs.validate.result == 'success')
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Package the validated commit and record file identities
        env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.sha }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          VALIDATION_RUN_ID: ${{ needs.resolve.outputs.validated == 'true' && github.event.workflow_run.id || github.run_id }}
          VALIDATION_RUN_ATTEMPT: ${{ needs.resolve.outputs.validated == 'true' && github.event.workflow_run.run_attempt || github.run_attempt }}
        run: >-
          python scripts/site_release.py --commit "$RELEASE_COMMIT"
          --workflow-commit "$WORKFLOW_COMMIT"
          --run-id "$VALIDATION_RUN_ID" --run-attempt "$VALIDATION_RUN_ATTEMPT"
          --output "$RUNNER_TEMP/verified-site"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-${{ needs.resolve.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-site
          retention-days: 7

  deploy:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ needs.resolve.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
