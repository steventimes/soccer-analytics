name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, research]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install prediction dependencies
        if: matrix.profile == 'minimal'
        run: python -m pip install -r requirements.txt
      - name: Install research dependencies
        if: matrix.profile == 'research'
        run: python -m pip install -r requirements-scouting.txt -r requirements-tree-models.txt
      - name: Check lightweight entry points and source boundaries
        if: matrix.profile == 'minimal'
        run: python scripts/check.py tests.test_analytics_cli.TestImportBoundaries.test_lightweight_entrypoints_do_not_load_unrelated_dependencies tests.test_analytics_cli.TestImportBoundaries.test_data_layer_never_imports_analysis_or_prediction
      - name: Check research and publication contracts
        if: matrix.profile == 'research'
        run: python scripts/check.py
